version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: credit-card-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: credit_card_tracker
      POSTGRES_USER: credit_card_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme123}
    volumes:
      # Use named volume for database persistence
      # Data stored in Docker's volume directory, managed by Docker
      - postgres-data:/var/lib/postgresql/data
    # Port mapping removed - not needed since app connects via Docker network
    # If you need to access the database externally for debugging, uncomment and change port:
    # ports:
    #   - "5433:5432"  # Map to different port to avoid conflict
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credit_card_user -d credit_card_tracker"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Web Application
  app:
    build: .
    container_name: credit-card-tracker-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://credit_card_user:${POSTGRES_PASSWORD:-changeme123}@db:5432/credit_card_tracker
      M365_TENANT_ID: ${M365_TENANT_ID:-03ca0a0f-0860-4fb7-ac51-ee8a12ec9503}
      M365_CLIENT_ID: ${M365_CLIENT_ID:-ac203045-b19d-43a8-82dc-7344b40df733}
      M365_CERT_THUMBPRINT: ${M365_CERT_THUMBPRINT:-346CE70F41D558B6D0310043735CF695E8EFF5D1}
      M365_CERT_PATH: /run/secrets/m365-private-key.pem
      M365_MAILBOX: ${M365_MAILBOX:-citi-offers@yither.com}
      M365_FOLDER_PATHS: ${M365_FOLDER_PATHS:-Inbox/Citi Offers/Chris,Inbox/Citi Offers/Janet}
      M365_AUTO_SYNC: ${M365_AUTO_SYNC:-true}
    volumes:
      - ${M365_CERT_HOST_PATH:-/volume1/docker/credit-card-tracker/secrets/m365-private-key.pem}:/run/secrets/m365-private-key.pem:ro
    depends_on:
      db:
        condition: service_healthy
    # Run migrations on startup, then start the app
    command: >
      sh -c "
        echo 'Waiting for database to be ready...' &&
        sleep 5 &&
        echo 'Running migrations...' &&
        npm run migrate &&
        npm run migrate-categories &&
        npm run migrate-offer-categories &&
        npm run migrate-add-tiers &&
        npm run migrate-multi-user &&
        echo 'Starting application...' &&
        npm start
      "

volumes:
  # Named volume for PostgreSQL data persistence
  # Docker automatically creates and manages this volume
  # Location: /var/lib/docker/volumes/credit-card-tracker_postgres-data/_data
  postgres-data:
